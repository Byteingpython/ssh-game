/*
 * This file was generated by the Gradle 'init' task.
 */

plugins {
    id 'application'
    id 'java-library'
    id 'com.gradleup.shadow' version '9.0.0-beta5'
}

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        url = uri('https://repo.maven.apache.org/maven2/')
    }
}

dependencies {
    implementation "com.sshtools:maverick-synergy-client:3.1.0"
    implementation "net.i2p.crypto:eddsa:0.3.0"
    implementation "org.slf4j:slf4j-api:2.0.12"
    implementation "org.apache.sshd:sshd-core:2.14.0"
    implementation "org.apache.sshd:sshd-common:2.14.0"
    implementation "org.apache.sshd:sshd-ldap:2.14.0"
    implementation "org.apache.sshd:sshd-openpgp:2.14.0"
    implementation "io.github.cdimascio:dotenv-java:3.0.0"
    implementation "com.surrealdb:surrealdb-driver:0.1.0"
    implementation "com.google.guava:guava:33.1.0-jre"
    implementation "org.java-websocket:Java-WebSocket:1.5.6"
    implementation "org.slf4j:slf4j-simple:2.0.12"
    implementation "org.bouncycastle:bcpkix-jdk18on:1.77"
    implementation "org.springframework.security:spring-security-crypto:6.4.2"
    implementation "redis.clients:jedis:5.1.2"
    testImplementation "org.junit.jupiter:junit-jupiter:5.10.1"
}

group = 'de.byteingpython'
version = '1.0-SNAPSHOT'
description = 'ssh-game'
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    mainClass = 'de.byteingpython.sshGame.Main'
}

jar {
    manifest {
        attributes'Main-Class' : application.mainClass
    }
    archiveFileName = "ssh-game.jar"
}
shadowJar {
    archiveFileName = "ssh-game-all.jar"
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

tasks.withType(Javadoc) {
    options.encoding = 'UTF-8'
}
