/*
 * This file was generated by the Gradle 'init' task.
 */

plugins {
    id 'application'
    id 'java-library'
    id 'com.gradleup.shadow' version '9.0.0-beta5'
}

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        url = uri('https://repo.maven.apache.org/maven2/')
    }
}

dependencies {
    implementation libs.com.sshtools.maverick.synergy.client
    implementation libs.net.i2p.crypto.eddsa
    implementation libs.org.slf4j.slf4j.api
    implementation libs.org.apache.sshd.sshd.core
    implementation libs.org.apache.sshd.sshd.common
    implementation libs.org.apache.sshd.sshd.ldap
    implementation libs.org.apache.sshd.sshd.openpgp
    implementation libs.io.github.cdimascio.dotenv.java
    implementation libs.com.surrealdb.surrealdb.driver
    implementation libs.com.google.guava.guava
    implementation libs.org.java.websocket.java.websocket
    implementation libs.org.slf4j.slf4j.simple
    implementation libs.org.bouncycastle.bcpkix.jdk18on
    implementation libs.org.springframework.security.spring.security.crypto
    implementation libs.redis.clients.jedis
    implementation 'io.github.cdimascio:dotenv-java:3.1.0'
    testImplementation libs.org.junit.jupiter.junit.jupiter
}

group = 'de.byteingpython'
version = '1.0-SNAPSHOT'
description = 'ssh-game'
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    mainClass = 'de.byteingpython.sshGame.Main'
}

jar {
    manifest {
        attributes 'Main-Class' : application.mainClass
    }
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

tasks.withType(Javadoc) {
    options.encoding = 'UTF-8'
}
