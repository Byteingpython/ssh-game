help=Hilfe
help_text=Hi! Danke, dass du mein Spiel spielst\n\nTastenkombinationen:\n  Allgemein: \n    ^: STRG \n    q oder ^C: Aktuelles Menü beenden \n  In Menüs: \n    Pfeil nach oben: Nächste Option \n    Pfeil nach unten: Nächste Option \n    Enter: aktuelle Auswahl bestätigen \n  In Texteingabefeldern: \n    Enter: Bestätigen \n  Lobby: \n    ^q: Spielsuche starten\n    ^m: Spielmodus der Lobby ändern \n    ^f: Freundesmenü \n    ^s: Einstellungsmenü \n    ^h: Diese Hilfeseite