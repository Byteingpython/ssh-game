# Help Screen
help=Help
help_text=Hey there! Thank you for playing my game\n\nKeybinds:\n  General: \n    ^: CTRL \n    q or ^C: Quit the current screen \n  In menus: \n    Arrow up: Previous element \n    Arrow down: Next element \n    Enter: Confirm the currently selected element \n  In text input screens: \n    Enter: Submit \n  Lobby: \n    ^q: Start matchmaking for the currently selected gamemode\n    ^m: Change the selected gamemode for your current lobby \n    ^f: Open the friends menu \n    ^s: Open the settings menu \n    ^h: Open this help page